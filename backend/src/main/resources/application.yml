spring:
  profiles:
    active: dev

  application:
    name: invoicepe-backend

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/invoicepe
    username: postgres
    password: localpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: your-256-bit-secret-here-replace-before-running
    expiration: 86400000

razorpay:
  key-id: rzp_test_xxxxxxxxxxxx
  key-secret: your-razorpay-secret
  webhook-secret: your-webhook-secret

whatsapp:
  phone-number-id: your-phone-number-id
  access-token: your-meta-access-token
  api-url: https://graph.facebook.com/v18.0

resend:
  api-key: re_xxxxxxxxxxxx
  from-email: invoices@invoicepe.in

  frontend-url: http://localhost:3000
  storage:
    supabase-url: https://xxxx.supabase.co
    supabase-key: your-supabase-anon-key
    bucket-name: invoices

server:
  port: 8080

logging:
  level:
    com.invoicepe: DEBUG
    org.springframework.security: DEBUG
