spring:
  profiles:
    active: dev

  application:
    name: invoicepe-backend

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/invoicepe
    username: postgres
    password: localpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${APP_JWT_SECRET:placeholder}
    expiration: 86400000
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  storage:
    supabase-url: ${SUPABASE_URL:placeholder}
    supabase-key: ${SUPABASE_KEY:placeholder}
    bucket-name: invoices

razorpay:
  key-id: rzp_test_xxxxxxxxxxxx
  key-secret: your-razorpay-secret
  webhook-secret: your-webhook-secret
  plans:
    pro: ${RAZORPAY_PLAN_PRO:}
    business: ${RAZORPAY_PLAN_BUSINESS:}

whatsapp:
  phone-number-id: your-phone-number-id
  access-token: your-meta-access-token
  api-url: https://graph.facebook.com/v18.0

resend:
  api-key: ${RESEND_API_KEY:placeholder}
  from-email: invoices@invoicepe.in

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.invoicepe: DEBUG
    org.springframework.security: DEBUG
